<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sumate a la playlist</title>

<script>
/* ============================================================
   ⬇️  LO ÚNICO QUE TENÉS QUE CAMBIAR (una vez por semana)  ⬇️

   Pegá acá abajo, entre las comillas, el link de invitación
   NUEVO que copiás de Spotify. Dejá todo lo demás igual.
   ============================================================ */

   var LINK_DE_SPOTIFY = "https://open.spotify.com/playlist/2J0XFi57twWAbYPJx5IXyX?si=be_h4S8oRZO1dZl8pvfbjg&utm_source=whatsapp&pi=guAmhoepT_uj_&pt=dcf466cb88cb4738c8c48d8433237b33";

/* ============================================================
   ⬆️  No toques nada más abajo de esta línea.  ⬆️
   ============================================================ */

  // Redirige a Spotify. Si el link todavía no fue cargado, muestra un aviso.
  window.addEventListener("DOMContentLoaded", function () {
    var linkOk = LINK_DE_SPOTIFY && LINK_DE_SPOTIFY.indexOf("http") === 0;
    var boton = document.getElementById("ir");
    var aviso = document.getElementById("aviso");

    var barra = document.getElementById("barra");
    if (linkOk) {
      boton.href = LINK_DE_SPOTIFY;
      if (barra) barra.hidden = false;   // muestra la barrita de progreso (8 segundos)
      // Espera 8 segundos (se puede saltar con el botón) y después redirige solo.
      setTimeout(function () { window.location.replace(LINK_DE_SPOTIFY); }, 8000);
    } else {
      // Todavía no se cargó un link válido.
      document.getElementById("cargando").hidden = true;
      if (barra) barra.hidden = true;
      aviso.hidden = false;
    }
  });
</script>

<style>
  :root{
    --verde:#1DB954; --verde2:#1ed760;
    --fondo:#0f1115; --card:#171a21; --texto:#f4f4f5; --suave:#a9adb6; --linea:#2a2e37;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:radial-gradient(1000px 600px at 50% -100px, #16351f 0%, transparent 60%), var(--fondo);
    color:var(--texto); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.55;
  }
  .card{
    width:100%; max-width:420px; background:var(--card); border:1px solid var(--linea);
    border-radius:20px; padding:34px 26px; text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .logo{
    display:block; width:208px; height:auto; margin:0 auto 20px;
    filter: brightness(0) invert(1) drop-shadow(0 4px 14px rgba(0,0,0,.5));
    animation:latido 3s ease-in-out infinite;
  }
  @keyframes latido{ 0%,100%{ transform:scale(1); opacity:.95 } 50%{ transform:scale(1.05); opacity:1 } }
  h1{ font-size:1.4rem; margin:0 0 6px; }
  p{ color:var(--suave); margin:0 0 20px; font-size:1rem; }
  .btn{
    display:inline-block; background:var(--verde); color:#062b13; text-decoration:none;
    font-weight:700; font-size:1.05rem; padding:14px 26px; border-radius:999px;
    transition:transform .05s ease, background .15s ease;
  }
  .btn:hover{ background:var(--verde2); }
  .btn:active{ transform:scale(.98); }
  .puntos::after{ content:""; animation:puntos 1.4s steps(4,end) infinite; }
  @keyframes puntos{ 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""} }
  .barra{ width:200px; max-width:78%; height:4px; margin:2px auto 22px; background:var(--linea); border-radius:999px; overflow:hidden; }
  .barra > span{ display:block; height:100%; width:0; background:var(--verde); border-radius:999px; animation:llenar 8s linear forwards; }
  @keyframes llenar{ to{ width:100%; } }
  .aviso{ color:#ffd27a; font-size:.95rem; }
  [hidden]{ display:none !important; }
</style>
